name: Build desktop bundles

# Ten plik jedzie razem z aplikacją do repozytorium gustawdaniel/brain-companion
# (publish/targets.toml → flatten), więc buduje się TYLKO wtedy, gdy wydajemy
# nową wersję Brain Companion — nie przy każdej zmianie w monorepo.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Dołączyć pliki do GitHub Release o tym tagu?'
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal, .dmg)
            os: macos-14
            args: '--target universal-apple-darwin'
            artifacts: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows (x64, .msi/.exe)
            os: windows-latest
            args: ''
            artifacts: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux (x64, .AppImage/.deb)
            os: ubuntu-22.04
            args: ''
            artifacts: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    steps:
      - uses: actions/checkout@v4

      - name: Instalacja zależności systemowych (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Zależności frontendu
        run: npm ci

      - name: Build (Tauri)
        run: npx tauri build ${{ matrix.args }}

      - name: Nazwy artefaktów
        id: names
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=()
          for pattern in ${{ matrix.artifacts }}; do
            for f in $pattern; do files+=("$f"); done
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "BŁĄD: brak artefaktów w ${ARTIFACT_GLOBS:-}" >&2
            exit 1
          fi
          printf 'Pliki: %s\n' "${files[*]}"
          {
            echo 'files<<EOF'
            printf '%s\n' "${files[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
        env:
          ARTIFACT_GLOBS: ${{ matrix.artifacts }}

      - uses: actions/upload-artifact@v4
        with:
          name: brain-companion-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

      - name: Dołącz pliki do wydania
        if: startsWith(github.ref, 'refs/tags/v') || inputs.upload_to_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Release tworzy publish/push.sh po wypchnięciu tagu — w wyścigu to my
          # możemy być pierwsi, więc zakładamy go, jeśli jeszcze nie istnieje.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Brain Companion $TAG" \
              --notes "Wydanie Brain Companion $TAG (pliki instalacyjne dla macOS, Windows i Linux)."
          fi
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            echo "→ $file"
            gh release upload "$TAG" "$file" --clobber
          done <<< "${{ steps.names.outputs.files }}"
