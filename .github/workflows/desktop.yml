name: Build app bundles

# Ten plik jedzie razem z aplikacją do repozytorium gustawdaniel/brain-companion
# (publish/targets.toml → flatten). Tag pojawia się TU dopiero wtedy, gdy zmieniły
# się pliki aplikacji — publish/push.sh porównuje drzewo bez manifestu monorepo
# i przy samym bumpie wersji monorepo nie tworzy nowego wydania. Dzięki temu
# nie budujemy DMG/AppImage bez powodu.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Dołączyć pliki do GitHub Release o tym tagu?'
        type: boolean
        default: false

concurrency:
  group: app-bundles-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: jeden uniwersalny DMG (Apple Silicon + Intel).
          - name: macOS (universal, .dmg)
            os: macos-latest
            args: '--target universal-apple-darwin'

          # Linux: AppImage + .deb (x64).
          - name: Linux (x64, .AppImage/.deb)
            os: ubuntu-22.04
            args: ''

    steps:
      - uses: actions/checkout@v4

      - name: Instalacja zależności systemowych (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Zależności frontendu
        run: npm ci

      # Wersja aplikacji = wersja wydania (tag v2026.11.2 → 2026.11.2), żeby
      # nazwy plików zgadzały się z tagiem, a nie zostawały na 0.1.0 z repo.
      - name: Wersja z tagu wydania
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            printf '{"version":"%s"}\n' "$VERSION" > src-tauri/tauri.release.conf.json
            echo "config=src-tauri/tauri.release.conf.json" >> "$GITHUB_OUTPUT"
            echo "📌 Wersja aplikacji: $VERSION"
          else
            echo "config=" >> "$GITHUB_OUTPUT"
            echo "ℹ️  Uruchomienie ręczne (bez tagu) — zostaje wersja z tauri.conf.json."
          fi

      - name: Sprawdź poświadczenia Apple Code Signing & Notarization (macOS)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          RAW_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          RAW_CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          RAW_SIGNING_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          RAW_APPLE_ID: ${{ secrets.APPLE_ID }}
          RAW_APPLE_PASS: ${{ secrets.APPLE_PASSWORD }}
          RAW_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "=== Sprawdzanie poświadczeń Apple Code Signing & Notarization ==="
          MISSING_SIGN=""
          MISSING_NOTARY=""

          [ -n "$RAW_CERT" ] || MISSING_SIGN="$MISSING_SIGN APPLE_CERTIFICATE"
          [ -n "$RAW_CERT_PASS" ] || MISSING_SIGN="$MISSING_SIGN APPLE_CERTIFICATE_PASSWORD"

          [ -n "$RAW_APPLE_ID" ] || MISSING_NOTARY="$MISSING_NOTARY APPLE_ID"
          [ -n "$RAW_APPLE_PASS" ] || MISSING_NOTARY="$MISSING_NOTARY APPLE_PASSWORD"
          [ -n "$RAW_TEAM_ID" ] || MISSING_NOTARY="$MISSING_NOTARY APPLE_TEAM_ID"

          if [ -n "$MISSING_SIGN" ]; then
            echo "::warning title=Brak certyfikatu Apple (unsigned build)::Pominięto podpisywanie i notaryzację macOS (brakujące sekrety:$MISSING_SIGN). Instalator .dmg powstanie bez podpisu deweloperskiego."
            echo "ℹ️  Build macOS (.dmg) zostanie ukończony jako niesygnowany. Po dodaniu sekretów przez Michała kolejne wydanie zostanie automatycznie podpisane i znotaryzowane."
          else
            echo "✓ Certyfikat Apple Developer ID jest dostępny."
            echo "APPLE_CERTIFICATE=$RAW_CERT" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$RAW_CERT_PASS" >> "$GITHUB_ENV"
            [ -n "$RAW_SIGNING_ID" ] && echo "APPLE_SIGNING_IDENTITY=$RAW_SIGNING_ID" >> "$GITHUB_ENV"

            if [ -n "$MISSING_NOTARY" ]; then
              echo "::warning title=Brak danych do notaryzacji Apple::Aplikacja zostanie podpisana certyfikatem, ale pominięto notaryzację (brakujące sekrety:$MISSING_NOTARY)."
            else
              echo "✓ Poświadczenia do notaryzacji Apple są skonfigurowane."
              echo "APPLE_ID=$RAW_APPLE_ID" >> "$GITHUB_ENV"
              echo "APPLE_PASSWORD=$RAW_APPLE_PASS" >> "$GITHUB_ENV"
              echo "APPLE_TEAM_ID=$RAW_TEAM_ID" >> "$GITHUB_ENV"
            fi
          fi

      - name: Build (Tauri)
        shell: bash
        run: |
          set -euo pipefail
          CONF="${{ steps.version.outputs.config }}"
          if [[ -n "$CONF" ]]; then
            npx tauri build --config "$CONF" ${{ matrix.args }}
          else
            npx tauri build ${{ matrix.args }}
          fi

      - name: Zbierz pliki instalacyjne
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          # Windows nie jest wspierany — tylko macOS (.dmg) i Linux (.AppImage/.deb).
          find src-tauri/target -type f -path '*/bundle/*' \
            \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp -v {} dist-release/ \;
          if [ -z "$(ls -A dist-release)" ]; then
            echo "BŁĄD: build nie wyprodukował żadnego pliku instalacyjnego" >&2
            exit 1
          fi
          ls -la dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: brain-companion-${{ matrix.os }}
          path: dist-release/*
          if-no-files-found: error

      - name: Dołącz pliki do wydania
        if: startsWith(github.ref, 'refs/tags/v') || inputs.upload_to_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Release tworzy publish/push.sh po wypchnięciu tagu — w wyścigu to my
          # możemy być pierwsi, więc zakładamy go, jeśli jeszcze nie istnieje.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Brain Companion $TAG" \
              --notes "Wydanie Brain Companion $TAG (macOS .dmg, Linux .AppImage/.deb, iOS .app bez podpisu)."
          fi
          gh release upload "$TAG" dist-release/* --clobber

  # iOS: bez certyfikatu Apple podpisu nie zrobimy, więc budujemy `.app` bez
  # podpisu — instaluje się przez Xcode / Apple Configurator na własnym telefonie.
  # Gotowy IPA do App Store/TestFlight wymaga konta Apple Developer i sekretów
  # (certyfikat + provisioning profile) — wtedy zmieniamy --no-sign na
  # --export-method app-store-connect.
  ios:
    name: iOS (unsigned .app)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Zależności frontendu
        run: npm ci

      - name: Projekt Xcode dla iOS (gen/apple)
        run: npx tauri ios init --ci

      - name: Build (bez podpisu)
        run: npx tauri ios build --ci --no-sign --target aarch64

      - name: Zbierz pakiet .app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          while IFS= read -r app; do
            name="$(basename "$app" | tr ' ' '-')"
            ditto -c -k --sequesterRsrc --keepParent "$app" "dist-release/${name}-ios-unsigned.zip"
          done < <(find src-tauri/gen/apple/build -type d -name '*.app' -maxdepth 6)
          if [ -z "$(ls -A dist-release)" ]; then
            echo "⚠️  iOS: build nie zwrócił pakietu .app — sprawdź log powyżej." >&2
            echo "    (Podpisany IPA wymaga konta Apple Developer; bez niego zostaje" >&2
            echo "     instalacja z Xcode na własnym urządzeniu.)" >&2
            exit 1
          fi
          ls -la dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: brain-companion-ios
          path: dist-release/*
          if-no-files-found: warn

      - name: Dołącz pakiet do wydania
        if: startsWith(github.ref, 'refs/tags/v') || inputs.upload_to_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Brain Companion $TAG" --notes "Wydanie Brain Companion $TAG."
          fi
          gh release upload "$TAG" dist-release/* --clobber
