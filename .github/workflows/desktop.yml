name: Build desktop bundles

# Ten plik jedzie razem z aplikacją do repozytorium gustawdaniel/brain-companion
# (publish/targets.toml → flatten), więc buduje się TYLKO wtedy, gdy wydajemy
# nową wersję Brain Companion — nie przy każdej zmianie w monorepo.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Dołączyć pliki do GitHub Release o tym tagu?'
        type: boolean
        default: false

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal, .dmg)
            os: macos-latest
            args: '--target universal-apple-darwin'

          - name: Windows (x64, .msi/.exe)
            os: windows-latest
            args: ''

          - name: Linux (x64, .AppImage/.deb)
            os: ubuntu-22.04
            args: ''

    steps:
      - uses: actions/checkout@v4

      - name: Instalacja zależności systemowych (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Zależności frontendu
        run: npm ci

      - name: Build (Tauri)
        run: npx tauri build ${{ matrix.args }}

      - name: Zbierz pliki instalacyjne
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          find src-tauri/target -type f -path '*/bundle/*' \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp -v {} dist-release/ \;
          if [ -z "$(ls -A dist-release)" ]; then
            echo "BŁĄD: build nie wyprodukował żadnego pliku instalacyjnego" >&2
            exit 1
          fi
          ls -la dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: brain-companion-${{ matrix.os }}
          path: dist-release/*
          if-no-files-found: error

      - name: Dołącz pliki do wydania
        if: startsWith(github.ref, 'refs/tags/v') || inputs.upload_to_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Release tworzy publish/push.sh po wypchnięciu tagu — w wyścigu to my
          # możemy być pierwsi, więc zakładamy go, jeśli jeszcze nie istnieje.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Brain Companion $TAG" \
              --notes "Wydanie Brain Companion $TAG (pliki instalacyjne dla macOS, Windows i Linux)."
          fi
          gh release upload "$TAG" dist-release/* --clobber
